apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-demo
  labels:
    app: observability-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-demo
  template:
    metadata:
      labels:
        app: observability-demo
    spec:
      containers:
        - name: api
          image: observability-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: observability-demo
  labels:
    app: observability-demo
spec:
  type: ClusterIP
  selector:
    app: observability-demo
  ports:
    - name: http
      port: 8000
      targetPort: http
